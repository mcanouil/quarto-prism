# _schema.yml for "prism" filter extension
# Describes attributes and options for IDE tooling and runtime validation.

# Attributes accepted by the filter on Div, Span, and CodeBlock elements.
# Keys follow the `format:name` pattern, where `format` is matched against
# the Quarto target format resolved from
# `quarto.format.format_identifier()["target-format"]` (e.g. `html`,
# `revealjs`, `typst`, `latex`, `mcanouil-typst`).
# The `slide` alias matches every HTML slide format (revealjs, slidy, s5,
# dzslides, slideous). The `default` prefix names a fallback value, applied
# only when no format-specific variant of the same name matched.
# When the prefix matches the active target format, the attribute is
# re-emitted as `name="value"`; otherwise it is dropped.
# Used in: ::: {revealjs:style="font-size: 2em;" html:style="font-size: 1.2rem;"}

$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json

options:
  warn-on-drop:
    type: boolean
    default: false
    title: Warn when a format-scoped attribute is dropped
    description: Emit a Quarto warning each time a format-scoped attribute is dropped because no prefix matched the active target format; useful to surface typos in prefixes that would otherwise vanish silently.
