# _schema.yml for "prism" filter extension
# Describes attributes for IDE tooling and runtime validation.

# Attributes accepted by the filter on Div, Span, and CodeBlock elements.
# Keys follow the `format:name` pattern, where `format` is any name that
# `quarto.doc.is_format` resolves (e.g. `html`, `revealjs`, `pdf`, `docx`,
# `typst`).
# When the prefix matches the active rendering format, the attribute is
# re-emitted as `name="value"`; otherwise it is dropped.
# Used in: ::: {revealjs:style="font-size: 2em;" html:style="font-size: 1.2rem;"}

$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v1/extension-schema.json
